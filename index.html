<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102139"><title>Quiz de Computação em Nuvem</title><meta name="description" content="30 questões interativas sobre computação em nuvem."><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#102139;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}header{background:#102139;color:#fff;padding:22px max(24px,calc((100vw - 980px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{font-size:1.16rem;letter-spacing:-.03em}header span{color:#bdd0e6;font-size:.9rem}main{max-width:980px;margin:0 auto;padding:34px 22px 70px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:12px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#42769e;font-weight:750;font-size:.8rem}.count{font-weight:700;color:#33506b}.track{height:7px;background:#d7e3ed;border-radius:10px;overflow:hidden;margin-bottom:30px}.fill{height:100%;background:#2876b3;transition:width .25s}.card{background:#fff;border:1px solid #dbe5ee;border-radius:22px;padding:clamp(24px,5vw,48px);box-shadow:0 18px 45px rgba(31,59,88,.07)}.context{font-size:1.04rem;line-height:1.7;color:#33475c;margin:0 0 25px}h1{font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.3;letter-spacing:-.025em;margin:0 0 27px}.options{display:grid;gap:11px}.option{width:100%;display:flex;align-items:flex-start;gap:15px;text-align:left;border:1.5px solid #d5e1ec;background:#f9fbfd;color:#172c42;border-radius:13px;padding:15px 17px;line-height:1.45;transition:background .15s,border-color .15s}.option:not(:disabled):hover{border-color:#4386bb;background:#f0f7fd}.option:disabled{cursor:default}.letter{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:7px;background:#e8f0f7;font-weight:750;font-size:.83rem}.option.correct{background:#e5f7e9;border-color:#2e9a55;color:#14512d}.option.correct .letter{background:#bce9c8}.option.wrong{background:#fdebea;border-color:#dc5a55;color:#832d29}.option.wrong .letter{background:#f8cbc8}.feedback{min-height:30px;margin:20px 0 0;font-weight:700}.feedback.good{color:#176a38}.feedback.bad{color:#a13b33}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.nav{border:1px solid #bbcddd;background:white;border-radius:10px;padding:11px 18px;color:#173b5a;font-weight:700}.nav.primary{background:#176399;border-color:#176399;color:white}.nav:disabled{opacity:.45;cursor:default}.completion{margin-top:24px;padding:20px;border:1px solid #a8cfeb;border-radius:13px;background:#edf7ff}.completion[hidden]{display:none}.completion h2{margin:0 0 8px;font-size:1.25rem}.completion p{margin:0 0 15px}.restart-row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-top:18px}.restart{background:transparent;border:0;border-bottom:1px solid currentColor;padding:6px 0;color:#176399;font-weight:700}.restart:focus-visible,button:focus-visible{outline:3px solid #4386bb;outline-offset:4px}.footer{margin-top:0;color:#5a7085;font-size:.88rem}@media(max-width:600px){header{padding:18px 22px;align-items:flex-start;flex-direction:column;gap:2px}main{padding:24px 15px 50px}.card{border-radius:17px}.option{padding:13px}.actions .nav{flex:1;padding:10px}}
</style></head><body><header><strong>Computação em Nuvem</strong><span>Quiz · 30 questões</span></header><main><div class="top"><div class="eyebrow" id="category"></div><div class="count" id="count"></div></div><div class="track" role="progressbar" aria-label="Progresso das questões" aria-valuemin="0" aria-valuemax="30" id="track"><div class="fill" id="fill"></div></div><section class="card" aria-live="polite"><p class="context" id="context"></p><h1 id="question" tabindex="-1"></h1><div class="options" id="options"></div><p class="feedback" id="feedback" role="status"></p><div class="actions"><button class="nav" id="prev">Anterior</button><button class="nav primary" id="next">Próxima</button></div><div class="completion" id="completion" hidden><h2>Teste concluído!</h2><p id="result"></p><button class="nav primary" id="restart-complete" type="button">Refazer e embaralhar perguntas</button></div></section><div class="restart-row"><div class="footer" id="score"></div><button class="restart" id="restart" type="button">Refazer e embaralhar</button></div></main><script>
const questions=[{"category": "SaaS e PaaS", "context": "Um provedor de sistema de gestão financeira cobra uma assinatura mensal por empresa cliente, atualiza a aplicação centralmente para todos os clientes ao mesmo tempo, e permite que a mesma instância do software seja compartilhada entre múltiplas empresas simultaneamente.", "question": "Quais características do modelo SaaS estão sendo descritas?", "options": ["Ausência de multilocação e atualização feita manualmente pelo cliente", "Licenciamento perpétuo por máquina e instalação local obrigatória", "Licenciamento por assinatura, atualização centralizada pelo provedor e multilocação", "Cobrança única e infraestrutura dedicada e exclusiva para cada cliente"], "answer": 2}, {"category": "Planejamento de capacidade", "context": "Uma empresa contrata capacidade computacional fixa bem acima do que normalmente utiliza, 'só para garantir', e a maior parte desses recursos permanece ociosa durante quase todo o tempo contratado.", "question": "Qual problema do planejamento de capacidade tradicional está sendo ilustrado?", "options": ["Cloud Bursting", "Escalabilidade horizontal", "Underprovision", "Overprovision"], "answer": 3}, {"category": "Modelos de programação", "context": "Uma equipe precisa processar em paralelo um enorme volume de dados não estruturados coletados de sites públicos, dividindo o trabalho em blocos processados simultaneamente em diferentes instâncias e, depois, mesclando os resultados intermediários.", "question": "Qual modelo de programação, desenvolvido pelo Google, atende a esse cenário?", "options": ["Erlang", "GridBatch", "Orleans", "MapReduce"], "answer": 3}, {"category": "Anatomia da nuvem", "context": "Um provedor oferece um ambiente com suporte a múltiplas linguagens de programação, bancos de dados, segurança de sistema operacional e middleware, para que desenvolvedores criem e hospedem aplicações sem administrar servidores físicos.", "question": "A qual componente da anatomia da nuvem esse ambiente corresponde?", "options": ["Datacenter (servidores e armazenamento)", "Camada de plataforma", "Camada de infraestrutura", "Camada de aplicações"], "answer": 1}, {"category": "Nuvem privada", "context": "Uma equipe de TI busca uma ferramenta open source, originada de uma necessidade da agência espacial norte-americana (Nasa) de administrar diversos hipervisores, organizada em componentes de controle, rede e computação.", "question": "Qual ferramenta de gerenciamento de nuvem privada está sendo descrita?", "options": ["OwnCloud", "CloudStack", "Eucalyptus", "OpenStack"], "answer": 3}, {"category": "Evolução e paradigmas", "context": "Uma universidade aproveita computadores ociosos de diferentes laboratórios durante a madrugada — máquinas com configurações de hardware distintas entre si — unindo-os para processar simulações científicas complexas.", "question": "Qual modelo de computação distribuída está sendo aplicado nesse cenário?", "options": ["Arquitetura orientada a serviços (SOA)", "Computação em grade (grid computing)", "Computação em cluster", "Computação paralela homogênea"], "answer": 1}, {"category": "Vantagens e economia", "context": "Uma ONG precisa de servidores robustos apenas durante os dois meses de uma campanha de arrecadação anual, ficando praticamente sem uso computacional no restante do ano.", "question": "Por que a computação em nuvem reduz o investimento inicial da ONG nesse cenário?", "options": ["Porque a nuvem elimina totalmente a necessidade de qualquer planejamento de recursos", "Porque a nuvem exige a compra de um datacenter próprio, amortizado ao longo de vários anos", "Porque a ONG precisa adquirir licenças perpétuas de software antes de iniciar a campanha", "Porque o modelo pay-per-use dispensa a compra antecipada de hardware, cobrando apenas pelo uso efetivo dos recursos"], "answer": 3}, {"category": "Características essenciais", "context": "Uma organização automatiza o desligamento dos servidores do setor administrativo fora do horário comercial, acompanhando pela camada de gerenciamento exatamente quanto cada recurso foi utilizado e o custo gerado no período.", "question": "Qual característica da computação em nuvem permite medir e cobrar com precisão esse tipo de uso?", "options": ["Serviços mensuráveis", "Amplo acesso à rede", "Aumento de produtividade", "Multi-inquilinos"], "answer": 0}, {"category": "Balanceamento de carga", "context": "Um balanceador de carga monitora continuamente, por meio de um canal de feedback, o nível de utilização de cada servidor disponível e redistribui as solicitações para manter todos os recursos uniformemente utilizados.", "question": "Qual tipo de balanceamento de carga está sendo descrito?", "options": ["Balanceamento de carga estático", "Balanceamento de carga dinâmico", "Escalabilidade vertical", "Cloud Bursting"], "answer": 1}, {"category": "Escalabilidade", "context": "O recurso de dimensionamento automático da computação em nuvem é sustentado por três pilares fundamentais, apoiados em um conjunto de recursos físicos.", "question": "Quais são esses três pilares, segundo o conteúdo estudado?", "options": ["Acordo de nível de serviço (SLA), SOA e SOC", "Virtualização de recursos, compartilhamento de recursos e provisionamento dinâmico", "Camada de aplicação, camada de plataforma e camada de infraestrutura", "Balanceamento de carga, Cloud Bursting e multilocação"], "answer": 1}, {"category": "Nuvem pública", "context": "Uma startup deixa de investir pesadamente na compra de servidores próprios e passa a pagar mensalmente apenas pelos recursos de nuvem pública efetivamente consumidos.", "question": "Essa mudança representa a transição de qual tipo de despesa para qual?", "options": ["Eliminação completa de qualquer tipo de custo", "Substituição do OPEX por licenciamento perpétuo de software", "De custo operacional (OPEX) para investimento em bens (CAPEX)", "De investimento em bens (CAPEX) para custo operacional (OPEX)"], "answer": 3}, {"category": "SaaS e PaaS", "context": "Os desenvolvedores de uma aplicação SaaS decidem que múltiplos clientes vão compartilhar a mesma instância de banco de dados, mas com tabelas separadas para isolar os dados de cada cliente.", "question": "Isso é um exemplo de multitenancy (multilocação) em qual nível?", "options": ["Nível de infraestrutura (IaaS)", "Nível de banco de dados", "Nível exclusivamente da aplicação", "Nível de rede"], "answer": 1}, {"category": "Nuvem híbrida", "context": "Ao integrar sua nuvem privada com um provedor de nuvem pública, uma empresa percebe que precisa lidar com APIs, protocolos de armazenamento e políticas de gerenciamento completamente diferentes entre os dois ambientes.", "question": "Qual desvantagem da nuvem híbrida essa empresa está enfrentando?", "options": ["Complexidade de integração e gerenciamento entre os ambientes", "Ausência total de escalabilidade na nuvem híbrida", "Impossibilidade de uso de contêineres na nuvem híbrida", "Incompatibilidade exclusiva de hardware físico"], "answer": 0}, {"category": "Evolução e paradigmas", "context": "Uma empresa reorganiza seus sistemas legados em componentes reutilizáveis e independentes, acessíveis por meio de serviços web padronizados, seguindo diretrizes de design, políticas corporativas e metodologias voltadas à disponibilização de serviços.", "question": "Qual conceito descreve melhor essa abordagem de reestruturação de sistemas?", "options": ["Arquitetura orientada a serviços (SOA)", "Multilocação", "Cloud Bursting", "Computação em nevoeiro (fog computing)"], "answer": 0}, {"category": "Nuvem híbrida", "context": "Para que dados críticos hospedados na nuvem privada de uma empresa trafeguem de forma criptografada até a nuvem pública, atravessando a internet pública de forma segura, é estabelecido um túnel criptografado entre os dois ambientes.", "question": "Qual recurso de conexão da nuvem híbrida está sendo utilizado?", "options": ["Cloud Bursting", "Virtual Private Network (VPN)", "Application Programming Interface (API)", "Conexão dedicada do provedor"], "answer": 1}, {"category": "Nuvem privada", "context": "Uma clínica médica contrata um datacenter terceirizado, que hospeda e administra uma infraestrutura de nuvem privada dedicada exclusivamente a ela, embora essa infraestrutura não esteja fisicamente dentro da clínica.", "question": "Qual tipo de nuvem privada está sendo utilizado pela clínica?", "options": ["Nuvem privada gerenciada", "Nuvem privada on-premise", "Nuvem pública", "Nuvem híbrida"], "answer": 0}, {"category": "Nuvem híbrida", "context": "O sistema de rematrícula on-line de uma faculdade roda normalmente na nuvem privada, mas quando o número de acessos ultrapassa um limite predefinido durante o período de rematrículas, o tráfego excedente passa a ser direcionado automaticamente para a nuvem pública.", "question": "Qual técnica de nuvem híbrida está sendo utilizada?", "options": ["Cloud Bursting", "Balanceamento de carga estático", "Escalabilidade vertical", "Federação estática de nuvens"], "answer": 0}, {"category": "Arquitetura em camadas", "context": "Uma ferramenta permite consolidar cargas de trabalho, monitorar acordos de nível de serviço (SLA) e gerenciar recursos da nuvem, mas não corresponde nem ao hardware físico do datacenter, nem ao dispositivo usado pelo usuário final.", "question": "A qual camada da arquitetura de cloud computing essa ferramenta pertence?", "options": ["Camada de recursos de hardware", "Camada de gerenciamento da nuvem", "Camada de rede", "Camada usuário/cliente"], "answer": 1}, {"category": "SaaS e PaaS", "context": "Ao adotar uma ferramenta PaaS para desenvolver uma nova aplicação, a equipe de desenvolvimento deixa de se preocupar com a implantação, o dimensionamento e a manutenção da infraestrutura, concentrando-se apenas nas funcionalidades do código.", "question": "O que explica essa mudança no processo de desenvolvimento?", "options": ["O PaaS automatiza e oculta etapas como implantação, dimensionamento e manutenção, fornecidas pelo próprio provedor da plataforma", "O PaaS elimina completamente a necessidade de qualquer teste da aplicação", "O PaaS é responsável apenas pela camada de hardware físico do datacenter", "O PaaS exige que o cliente gerencie manualmente cada uma dessas etapas em servidores próprios"], "answer": 0}, {"category": "Nuvem híbrida", "context": "Uma equipe de desenvolvimento precisa mover uma aplicação entre ambientes de desenvolvimento, teste e produção, mantendo total portabilidade, com empacotamento do código-fonte, configurações e dependências, sem depender de uma máquina virtual completa para cada ambiente.", "question": "Qual tecnologia atende melhor a essa necessidade em um ambiente de nuvem híbrida?", "options": ["Contêineres", "Máquinas virtuais completas para cada ambiente", "VPN dedicada", "Cloud Bursting"], "answer": 0}, {"category": "Planejamento de capacidade", "context": "Durante a transmissão ao vivo do lançamento de um produto, o número de acessos simultâneos superou em muito a previsão feita pela equipe de TI, e o sistema não tinha recursos suficientes, ficando lento para os usuários.", "question": "Qual problema do planejamento de capacidade tradicional está sendo ilustrado?", "options": ["Balanceamento de carga estático", "Underprovision", "Overprovision", "Multilocação"], "answer": 1}, {"category": "Características essenciais", "context": "Um usuário provisiona uma nova máquina virtual diretamente pela interface web do provedor, em poucos minutos, sem precisar abrir um chamado ou conversar com a equipe do provedor de nuvem.", "question": "Qual característica essencial da computação em nuvem está demonstrada?", "options": ["Amplo acesso à rede", "Autosserviço sob demanda", "Multi-inquilinos", "Serviços mensuráveis"], "answer": 1}, {"category": "Vantagens e economia", "context": "Uma fábrica sabe, com boa previsibilidade, que vai precisar de uma capacidade computacional estável pelos próximos três anos e fecha um contrato antecipado com o provedor de nuvem, pagando uma taxa fixa por esse período.", "question": "Qual modelo de precificação de nuvem está sendo utilizado pela fábrica?", "options": ["Plano de reserva de longo prazo (provisionamento antecipado)", "Plano sob demanda de curto prazo", "Cloud Bursting", "Preço por unidade de transferência de dados"], "answer": 0}, {"category": "Vantagens e economia", "context": "Um desenvolvedor publica pequenas funções que são executadas automaticamente sob demanda e cobradas por execução, sem que ele precise provisionar, gerenciar ou dimensionar nenhum servidor.", "question": "Qual tecnologia emergente da nuvem está sendo utilizada?", "options": ["Computação em grade", "Balanceamento de carga estático", "Virtualização de hardware bare-metal", "Computação serverless (Function as a Service)"], "answer": 3}, {"category": "Nuvem privada", "context": "Uma seguradora opta por nuvem privada para armazenar dados de sinistros, priorizando baixa latência com servidores locais e maior controle sobre auditorias de segurança.", "question": "Segundo o conteúdo estudado, qual é a principal desvantagem associada a essa escolha?", "options": ["Impossibilidade de virtualização dos servidores", "Custo mais elevado de implementação e manutenção da infraestrutura", "Impossibilidade de escalabilidade dos recursos", "Ausência completa de acordo de nível de serviço (SLA)"], "answer": 1}, {"category": "Vantagens e economia", "context": "Um serviço de streaming de vídeo continua funcionando normalmente para os usuários mesmo quando parte da infraestrutura do provedor sofre uma falha de hardware, graças a mecanismos de redundância e recuperação automática.", "question": "Qual característica da computação em nuvem está sendo demonstrada?", "options": ["Resiliência", "Virtualização de rede", "Aquisição de licença desnecessária", "Multilocação"], "answer": 0}, {"category": "Evolução e paradigmas", "context": "Em 1961, John McCarthy defendeu que a computação poderia se tornar um serviço público, no qual cada assinante pagaria apenas pelos recursos que efetivamente utilizasse, de forma semelhante à eletricidade ou à telefonia.", "question": "Essa visão é reconhecida como a base de qual conceito, que antecedeu a computação em nuvem?", "options": ["Arquitetura orientada a serviços (SOA)", "Computação em grade (grid computing)", "Computação como utilidade (utility computing)", "Computação em nevoeiro (fog computing)"], "answer": 2}, {"category": "Nuvem pública", "context": "Uma empresa avalia migrar para a nuvem pública um sistema legado, desenvolvido internamente há muitos anos, com forte dependência de configurações e integrações específicas do ambiente local.", "question": "Qual é a principal preocupação técnica destacada para esse tipo de migração?", "options": ["Compatibilidade e adaptação do sistema legado à estrutura da nuvem", "Ausência total de conectividade com a internet", "Impossibilidade de qualquer forma de pagamento sob demanda", "Custo elevado de licenciamento de software livre"], "answer": 0}, {"category": "Nuvem pública", "context": "Um provedor de nuvem pública atende simultaneamente milhares de empresas de portes e segmentos diferentes, todas compartilhando a mesma infraestrutura física subjacente, cada uma com seus dados logicamente isolados.", "question": "Qual característica fundamental da nuvem pública está sendo descrita?", "options": ["Nuvem privada gerenciada", "Escalabilidade vertical", "Balanceamento de carga estático", "Multilocação (multitenancy)"], "answer": 3}, {"category": "Escalabilidade", "context": "Para atender ao crescimento de demanda de uma aplicação, uma empresa substitui o processador e a memória do mesmo servidor virtual por componentes mais potentes, sem adicionar novos servidores ao ambiente.", "question": "Qual é a principal desvantagem dessa abordagem de escalabilidade vertical?", "options": ["Exige redesenhar a aplicação inteira para um ambiente distribuído", "Ausência total de gerenciamento centralizado dos recursos", "Custo elevado de hardware especializado, limite físico de capacidade e possível interrupção durante a troca", "Impossibilidade de qualquer ganho de desempenho"], "answer": 2}];let current=0;const selected=Array(questions.length).fill(null);const $=id=>document.getElementById(id);function render(){const q=questions[current],choice=selected[current];$('category').textContent=q.category;$('count').textContent=`${current+1} / ${questions.length}`;$('context').textContent=q.context;$('question').textContent=q.question;$('track').setAttribute('aria-valuenow',current+1);$('fill').style.width=`${(current+1)/questions.length*100}%`;const box=$('options');box.replaceChildren();q.options.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(choice!==null?(i===q.answer?' correct':i===choice?' wrong':''):'');b.disabled=choice!==null;b.setAttribute('aria-label',`Alternativa ${'ABCD'[i]}: ${label}`);const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];const text=document.createElement('span');text.textContent=label;b.append(letter,text);b.onclick=()=>{selected[current]=i;render()};box.append(b)});const f=$('feedback');f.textContent=choice===null?'':choice===q.answer?'Correto!':'Incorreto. A resposta certa está em verde.';f.className='feedback '+(choice===null?'':choice===q.answer?'good':'bad');$('prev').disabled=current===0;$('next').textContent=current===questions.length-1?'Voltar à primeira':'Próxima';const done=selected.filter(x=>x!==null).length;const right=selected.reduce((n,x,i)=>n+(x===questions[i].answer?1:0),0);$('score').textContent=`Respondidas: ${done} de ${questions.length} · Acertos: ${right}`;$('completion').hidden=done!==questions.length;$('result').textContent=`Você acertou ${right} de ${questions.length} questões. Comece uma nova tentativa com as perguntas em outra ordem.`;if(done===questions.length&&current===questions.length-1)$('next').textContent='Refazer e embaralhar'}
$('prev').onclick=()=>{if(current>0){current--;render();window.scrollTo(0,0)}};function restart(){const before=questions.slice();for(let i=questions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}if(questions.every((q,i)=>q===before[i]))questions.push(questions.shift());selected.fill(null);current=0;render();$('feedback').textContent='Teste reiniciado com perguntas embaralhadas. Escolha uma resposta para começar.';$('question').focus();window.scrollTo(0,0)}$('restart').onclick=restart;$('restart-complete').onclick=restart;$('next').onclick=()=>{if(current===questions.length-1&&selected.every(x=>x!==null)){restart();return}current=(current+1)%questions.length;render();window.scrollTo(0,0)};render();
</script></body></html>
